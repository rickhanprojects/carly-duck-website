<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carly's Duck Pond</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Left Sidebar: Image Gallery -->
    <aside class="sidebar">
      <h2>Gallery</h2>
      <div class="gallery" id="gallery">
        <!-- Images are populated by JS -->
      </div>
    </aside>

    <!-- Right: Whiteboard -->
    <main class="whiteboard-container">
      <div class="toolbar">
        <h1>🦆 Carly's Duck Pond</h1>
        <button id="clearBtn" title="Clear board">Clear All</button>
      </div>
      <div class="whiteboard" id="whiteboard">
        <!-- Placed items go here -->
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
